<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Romeo Flowers — букеты круглосуточно, Костанай</title>
<meta name="description" content="Букеты с доставкой по Костанаю круглосуточно. Каталог, заказ в WhatsApp, бонусы за важные даты.">

<!-- Карточка при пересылке в WhatsApp и директ. Менеджеры кидают ссылку постоянно,
     а без этих тегов там был голый адрес, по которому не кликают. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Romeo Flowers">
<meta property="og:title" content="Romeo Flowers — букеты круглосуточно">
<meta property="og:description" content="Доставка по Костанаю в любое время суток. Каталог, заказ в WhatsApp, 3000 бонусов за важные даты.">
<meta property="og:url" content="https://romeo-flowers.kz/">
<meta property="og:image" content="https://romeo-flowers.github.io/anketa/vitrina/img/logo.png">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://romeo-flowers.github.io/anketa/vitrina/img/logo.png">
<link rel="apple-touch-icon" href="https://romeo-flowers.github.io/anketa/vitrina/img/logo.png">

<!-- ⚠️ Этот файл — КОПИЯ страницы-хаба из репозитория anketa (папка go/), живущая на
     собственном домене romeo-flowers.kz. Репозиторий anketa намеренно не трогаем: на его
     адреса romeo-flowers.github.io/anketa/... завязаны живые WhatsApp-шаблоны анкеты и
     отзывов, и переносить их на домен ради красоты — риск ради ничего.
     Отсюда правило: правишь хаб — правь в ОБОИХ местах. Шрифты, логотип, каталог и
     data.json тянутся с github.io кросс-доменно, это работает, у GitHub Pages стоит
     Access-Control-Allow-Origin: *  (проверено 11.08.2026). -->

<style>
  @font-face{font-family:Circe;src:url(https://romeo-flowers.github.io/anketa/vitrina/fonts/circe-300.woff2) format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:Circe;src:url(https://romeo-flowers.github.io/anketa/vitrina/fonts/circe-400.woff2) format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:Circe;src:url(https://romeo-flowers.github.io/anketa/vitrina/fonts/circe-700.woff2) format('woff2');font-weight:700;font-display:swap}
  :root{--green:#8ca28c;--green-dark:#7a9079;--cream:#ece7e1;--card:#faf8f5;--ink:#2f3330}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--cream);color:var(--ink);
       font-family:Circe,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:400}
  .wrap{max-width:460px;margin:0 auto;padding:0 20px 40px;min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--green);margin:0 -20px;padding:34px 20px 28px;text-align:center}
  header img{width:132px;height:auto;display:block;margin:0 auto}
  .tag{margin:24px 0 20px;text-align:center;font-size:15px;line-height:1.55;color:#5c635c}
  .tag b{font-weight:700;color:#3f463e}
  a.btn{display:block;background:var(--green);color:#fff;text-decoration:none;border-radius:14px;
        padding:17px 18px;margin-bottom:12px;text-align:center;transition:transform .12s ease,background .12s ease}
  a.btn:active{transform:scale(.985);background:var(--green-dark)}
  a.btn .t{display:block;font-weight:700;font-size:15px;letter-spacing:2.4px;text-transform:uppercase}
  a.btn .s{display:block;margin-top:5px;font-size:13px;font-weight:300;opacity:.85;letter-spacing:.2px;text-transform:none}
  a.btn.ghost{background:var(--card);color:var(--ink);border:1px solid #dcd6ce}
  a.btn.ghost:active{background:#f2eee9}
  /* Три букета показываем ДО перехода в каталог: человек видит товар и цену, а не «кота
     в мешке». Тянутся из того же data.json, что и витрина, поэтому обновляются сами. */
  #picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
  #picks a{display:block;text-decoration:none;color:var(--ink);background:var(--card);
           border-radius:12px;overflow:hidden;border:1px solid #e2ddd6}
  #picks img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#e6e1da}
  #picks .n{font-size:11px;line-height:1.25;padding:6px 7px 0;height:28px;overflow:hidden;font-weight:300}
  #picks .p{font-size:12px;font-weight:700;padding:2px 7px 8px;white-space:nowrap}
  footer{margin-top:auto;padding-top:26px;text-align:center;font-size:12.5px;color:#8d938c;line-height:1.7}
  footer a{color:#8d938c}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="https://romeo-flowers.github.io/anketa/vitrina/img/logo.png" alt="Romeo Flowers"></header>

  <p class="tag">Букеты и доставка по Костанаю<br><b>круглосуточно, без выходных</b></p>

  <a class="btn" href="https://wa.me/77003696666?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5!%20%D0%A5%D0%BE%D1%87%D1%83%20%D0%B7%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D1%82%D1%8C%20%D0%B1%D1%83%D0%BA%D0%B5%D1%82" data-go="whatsapp">
    <span class="t">Заказать в WhatsApp</span>
    <span class="s">Подскажем и соберём под ваш повод</span>
  </a>

  <a class="btn" href="https://romeo-flowers.github.io/anketa/vitrina/" data-go="vitrina">
    <span class="t">Каталог букетов</span>
    <span class="s">Выбрать букет и оформить за минуту</span>
  </a>

  <div id="picks" hidden></div>

  <a class="btn" href="https://romeo-flowers.github.io/anketa/" data-go="anketa">
    <span class="t">Напомним о важных датах</span>
    <span class="s">Оставьте даты близких, дарим 3000 баллов</span>
  </a>

  <footer>
    Костанай, Алтынсарина 32<br>
    <a href="tel:+77003696666">+7 700 369 66 66</a>
  </footer>
</div>

<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbx0FYyE3hckyyyhzZPbf4X2gELlhLoGNj8YbRfJcjj1bTbKlKjo-n16cMUWN7SBnxDepw/exec';
  var BASE = 'https://romeo-flowers.github.io/anketa/';
  // Копий хаба теперь две — на домене и на github.io. Чтобы в статистике их не путать,
  // источник по умолчанию помечаем доменом, с которого пришли.
  var host = location.hostname.indexOf('romeo-flowers.kz') >= 0 ? 'bio-kz' : 'bio';
  var src = (new URLSearchParams(location.search).get('utm_source') || host).slice(0, 40);
  var ua = /android|iphone|ipad|mobile/i.test(navigator.userAgent) ? 'mobile' : 'desktop';

  // sendBeacon переживает уход со страницы — иначе клик терялся бы у всех, кто уходит
  // мгновенно, а это как раз те, кто нам нужен. Content-Type text/plain, чтобы не было
  // preflight к Apps Script.
  function track(event, target) {
    var payload = JSON.stringify({ type: 'hub_event', event: event, target: target || '', src: src, ua: ua });
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon(EXEC, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
        return;
      }
    } catch (e) {}
    try { fetch(EXEC, { method: 'POST', body: payload, headers: { 'Content-Type': 'text/plain' }, keepalive: true }); } catch (e) {}
  }

  function bind(a) {
    // Ссылку НЕ перехватываем и переход не откладываем: маяк уходит фоном, человек сразу.
    a.addEventListener('click', function () { track('click', a.getAttribute('data-go')); });
  }

  track('view');
  document.querySelectorAll('a[data-go]').forEach(bind);

  // Три букета из витрины. Случайные при каждом заходе: показывают ассортимент, а не одно
  // и то же, и заодно сами себя проверяют на отклик. Падение подгрузки страницу не ломает —
  // блок просто остаётся скрытым.
  fetch(BASE + 'vitrina/data.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (items) {
      if (!Array.isArray(items) || !items.length) return;
      var pool = items.filter(function (i) { return i && i.photo && i.price; }).slice();
      var box = document.getElementById('picks'), n = Math.min(3, pool.length);
      for (var k = 0; k < n; k++) {
        var it = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
        var a = document.createElement('a');
        a.href = BASE + 'vitrina/';
        a.setAttribute('data-go', 'vitrina_card');
        // Фото в data.json лежат относительными путями от витрины — на своём домене
        // их надо достроить до абсолютных, иначе картинки не найдутся.
        var photo = /^https?:/.test(it.photo) ? it.photo : BASE + 'vitrina/' + String(it.photo).replace(/^\.?\//, '');
        a.innerHTML = '<img loading="lazy" src="' + photo + '" alt="">' +
          '<div class="n">' + String(it.name || '').replace(/[<>]/g, '') + '</div>' +
          '<div class="p">' + Number(it.price).toLocaleString('ru-RU') + ' ₸</div>';
        bind(a);
        box.appendChild(a);
      }
      if (box.children.length) box.hidden = false;
    })
    .catch(function () {});
})();
</script>
</body>
</html>
