<style>

  :root{--green:#8ca28c;--green-dark:#7a9079;--cream:#ece7e1;--card:#faf8f5;--ink:#2f3330}

  .wrap{max-width:460px;margin:0 auto;padding:0 20px 40px;min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--green);margin:0 -20px;padding:34px 20px 28px;text-align:center}

<script>
(function () {
  // Счётчик для отчётов Бастыка (Эффект.js проекта Ромео Атырау): открытия и
  // нажатия ложатся в лист ХАБ_КЛИКИ и попадают в утренний и недельный отчёт.
  var EXEC = 'https://script.google.com/macros/s/AKfycbwz5Ukf7UnpHP_1D8pFngPbCK43x6enVSCgN6Xb5UjNYsFAJYxFVio7DF0wgjj9he9O/exec';
  var src = (new URLSearchParams(location.search).get('utm_source') || 'bio').slice(0, 40);
  var ua = /android|iphone|ipad|mobile/i.test(navigator.userAgent) ? 'mobile' : 'desktop';

  // sendBeacon переживает уход со страницы. text/plain — без preflight к Apps Script.
  function track(event, target) {
    var payload = JSON.stringify({ type: 'hub_event', event: event, target: target || '', src: src, ua: ua });
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(EXEC, new Blob([payload], { type: 'text/plain;charset=UTF-8' }))) return;
    } catch (e) {}
    try { fetch(EXEC, { method: 'POST', body: payload, headers: { 'Content-Type': 'text/plain' }, keepalive: true }); } catch (e) {}
  }

  track('view');
  document.querySelectorAll('a[data-go]').forEach(function (a) {
    a.addEventListener('click', function () { track('click', a.getAttribute('data-go')); });
  });
})();
</script>
